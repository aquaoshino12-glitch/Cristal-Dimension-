name: Build ECHOES

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -o "$ZIP" -d extracted
          BUILD_DIR=$(find extracted -name build.gradle -o -name build.gradle.kts | head -n 1)
          cd "$(dirname "$BUILD_DIR")"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")
          s = p.read_text()

          s = re.sub(
              r'modImplementation\s*["\']net\.fabricmc\.fabric-api:[^"\']+["\']',
              'modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"',
              s
          )

          if "maven.fabricmc.net" not in s:
              repo = 'repositories { maven { url "https://maven.fabricmc.net/" } }\\n'
              s = repo + s

          p.write_text(s)
          Path("gradle.properties").write_text(
              "org.gradle.jvmargs=-Xmx2G\\norg.gradle.parallel=true\\n"
          )
          PY

          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ECHOES-mod
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
