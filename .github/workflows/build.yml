
name: Build ECHOES

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -o ECHOES_Fabric_1.21.1_GITHUB_READY.zip -d extracted
          find extracted -name build.gradle -print

      - name: Build mod
        run: |
          cd extracted
          PROJECT=$(find . -name build.gradle -printf '%h\n' | head -n 1)
          cd "$PROJECT"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ECHOES-mod-jar
          path: extracted/**/build/libs/*.jar
          
