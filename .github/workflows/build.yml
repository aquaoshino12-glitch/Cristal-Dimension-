
name: Build ECHOES

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Aucun ZIP trouvé à la racine du dépôt."
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          BUILD_DIR=$(find extracted -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Aucun fichier Gradle trouvé dans le ZIP."
            exit 1
          fi
          cd "$(dirname "$BUILD_DIR")"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ECHOES-mod
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
