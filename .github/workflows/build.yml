

name: Build ECHOES

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -o ECHOES_Fabric_1.21.1_GITHUB_READY.zip -d extracted

      - name: Configure plugin repositories
        run: |
          cd extracted
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'ECHOES'
          EOF

      - name: Build mod
        run: |
          cd extracted
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ECHOES-mod-jar
          path: extracted/build/libs/*.jar
          
